name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"   # runs daily at 2am IST
  workflow_dispatch:       # manual trigger from Actions tab

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kumar-gautam24
          template: classic
          base: header, repositories
          base_hireable: yes

          # Language breakdown from commit diffs — not file tree weights
          # This correctly shows Dart/Go/Python instead of C++ from Flutter build files
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_ignored: >-
            cmake, c, c++, html, css, makefile, dockerfile,
            shell, batchfile, ruby, cython, swift
          plugin_languages_limit: 6
          plugin_languages_threshold: 0%
          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 180

          # Isometric 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding habits deduced from last 1000 events
          plugin_habits: yes
          plugin_habits_from: 1000
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          config_timezone: Asia/Kolkata
          config_display: large
          filename: github-metrics.svg
          committer_message: "chore: update metrics [skip ci]"
          committer_branch: main
