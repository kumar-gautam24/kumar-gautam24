name: Metrics

on:
  schedule:
    # 2:37 AM IST. Two deliberate details:
    #   - `timezone` is used because bare cron is UTC, so the old "0 2 * * *"
    #     actually fired at 7:30 AM IST, not 2 AM.
    #   - minute 37, not 0: GitHub delays scheduled runs under load and the top
    #     of the hour is the worst slot. The old schedule was landing ~3 hours
    #     late (02:00 UTC requested, 04:54-05:38 UTC observed).
    - cron: "37 2 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:       # manual trigger from Actions tab

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── Card 1: contribution activity + streaks ────────────────────────────
      # base is empty on purpose: GitHub already renders the avatar, name and
      # join date directly above the README, so base_header only duplicates it.
      - name: Activity card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kumar-gautam24
          template: classic
          base: ""
          config_display: regular          # 480px, sits half-width in the README
          config_timezone: Asia/Kolkata
          filename: metrics.activity.svg
          committer_message: "chore: update activity card [skip ci]"
          committer_branch: main

          # half-year, not full-year: the isometric calendar is a diagonal band,
          # so a longer range only adds empty triangles above and below it
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ── Card 2: language breakdown ─────────────────────────────────────────
      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kumar-gautam24
          template: classic
          base: ""
          config_display: regular
          config_timezone: Asia/Kolkata
          filename: metrics.languages.svg
          committer_message: "chore: update languages card [skip ci]"
          committer_branch: main

          # REQUIRED. Asking for 100 repositories in one GraphQL query 502s for
          # this account, and metrics' retry is broken (the `continue` in its
          # do/while re-tests `pushed`, which is still 0 on the first attempt),
          # so it silently yields zero repositories and every repo-derived
          # figure renders as 0 or blank. 30 is comfortably inside what the API
          # serves; note this also caps analysis at 30 repos, ordered by most
          # recently updated.
          repositories_batch: 30

          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_limit: 4
          plugin_languages_details: percentage
          # Suppress scaffolding, never suppress real work. Everything here is
          # generated by Flutter's platform folders (android/ios/linux/macos/
          # windows/web) or by Python packaging -- none of it is hand-written.
          # Dockerfile and Shell are deliberately NOT ignored: they are small
          # but they are genuinely mine.
          plugin_languages_ignored: >-
            cmake, c, c++, swift, objective-c, ruby, batchfile,
            powershell, makefile, html, css, cython, mako, java
